# Middle topic map for this technology. Must-know topics need a Middle lesson (content:validate).
topics:
  - { id: react-jsx-rendering, title: 'Components, JSX and the render/commit cycle', priority: must }
  - { id: react-state-props, title: 'State, props and immutable updates', priority: must }
  - { id: react-keys-reconciliation, title: 'Lists, keys and reconciliation', priority: must }
  - { id: react-rules-of-hooks, title: 'Rules of hooks', priority: must }
  - { id: react-custom-hooks, title: 'Custom hooks', priority: must }
  - { id: react-effects, title: 'Effects, dependencies and cleanup', priority: must }
  - { id: react-memoization, title: 'Re-renders, memoization and the React Compiler', priority: must }
  - { id: react-context, title: 'Context', priority: must }
  - { id: react-state-management, title: 'Where state should live: local, context, query cache, stores', priority: must }
  - { id: react-forms, title: 'Forms: controlled vs uncontrolled, actions and validation', priority: must }
  - { id: react-refs-portals, title: 'Refs, ref as a prop, imperative handles and portals', priority: must }
  - { id: react-error-boundaries-suspense, title: 'Error boundaries, Suspense and lazy loading', priority: must }
  - { id: react-19, title: 'React 19 features: actions, useActionState, useOptimistic, use', priority: must }
  - { id: react-concurrent, title: 'Concurrent rendering, transitions and batching', priority: must }
  - { id: react-internals, title: 'Virtual DOM, Fiber and reconciliation internals', priority: good }
  - { id: react-patterns, title: 'Composition, compound components, HOC, render props, one-way data flow, anti-patterns', priority: must }
